<!doctype html>
<html><head><meta charset="utf-8"><title>Game menu</title>
<link href="fonts.css" rel="stylesheet">
<script src="echarts.min.js"></script><script src="data.js"></script><script src="lib.js"></script>
<style>
:root { --bg:#0c1e48; --bg2:#0f2557; --tile:#15306b; --tile2:#1b3a7e; --edge:#2b4c92; --gold:#dab16f; --gold2:#f0d39a; --orange:#ee7660; --cyan:#39d0ff; --ink:#f4f7ff; --dim:#9db0dc; --win:#4fe0a0; --loss:#ff6b6b; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: Rajdhani, sans-serif; width: 1440px; }
.top { display: flex; align-items: center; height: 70px; padding: 0 30px; background: #0a1a3f; border-bottom: 2px solid var(--edge); gap: 18px; }
.top .logo { font: 600 34px Teko; letter-spacing: .06em; color: var(--gold); }
.top .season { font: 600 15px Rajdhani; letter-spacing: .2em; color: var(--dim); text-transform: uppercase; }
.top .chip { margin-left: auto; display: flex; align-items: center; gap: 10px; background: var(--tile); border: 1px solid var(--edge); padding: 6px 16px 6px 8px; border-radius: 30px; font: 600 16px Rajdhani; }
.top .chip b { font: 600 24px Teko; color: var(--gold); line-height: 1; }
.top .keys { font: 600 13px Rajdhani; color: var(--dim); letter-spacing: .1em; }
.top .keys kbd { background: var(--tile2); border: 1px solid var(--edge); border-radius: 5px; padding: 1px 7px; color: var(--ink); margin: 0 4px; font: 600 12px Rajdhani; }
.wrap { display: grid; grid-template-columns: 250px 1fr; min-height: 830px; }
.menu { background: #0a1a3f; border-right: 2px solid var(--edge); padding: 26px 0; }
.menu a { display: flex; align-items: center; gap: 12px; padding: 12px 26px; font: 500 30px/1 Teko; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); text-decoration: none; border-left: 5px solid transparent; }
.menu a.on { color: #fff; background: linear-gradient(90deg, rgba(238,118,96,.28), transparent); border-left-color: var(--orange); font-size: 36px; }
.menu a .ar { color: var(--orange); font-size: 22px; visibility: hidden; } .menu a.on .ar { visibility: visible; }
.menu .hint { margin: 30px 26px 0; font: 600 13px Rajdhani; color: var(--dim); letter-spacing: .1em; line-height: 1.6; }
.content { padding: 24px 28px 34px; }
h1 { font: 600 52px/1 Teko; letter-spacing: .04em; text-transform: uppercase; }
h1 small { font: 600 18px Rajdhani; letter-spacing: .18em; color: var(--gold); display: block; margin-bottom: 4px; }
.g { display: grid; gap: 16px; margin-top: 18px; }
.box { background: var(--tile); border: 1px solid var(--edge); border-radius: 14px; padding: 16px 18px; position: relative; clip-path: polygon(0 0, calc(100% - 22px) 0, 100% 22px, 100% 100%, 0 100%); }
.box h3 { font: 600 15px Rajdhani; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
.card { width: 166px; height: 270px; border-radius: 16px; background: linear-gradient(160deg, var(--gold2), var(--gold) 55%, #b98d45); color: #1c1405; position: relative; padding: 16px 16px 12px; clip-path: polygon(14% 0, 86% 0, 100% 9%, 100% 100%, 0 100%, 0 9%); box-shadow: 0 10px 30px rgba(0,0,0,.35); flex: 0 0 auto; }
.card .rt { font: 600 52px/0.9 Teko; } .card .pos { font: 700 14px Rajdhani; letter-spacing: .12em; }
.card .lg { position: absolute; right: 14px; top: 16px; }
.card .nm { font: 600 26px/1 Teko; text-transform: uppercase; text-align: center; margin-top: 70px; border-bottom: 1px solid rgba(28,20,5,.3); padding-bottom: 6px; }
.card .st { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; margin-top: 8px; font: 700 13px Rajdhani; }
.card.mvp { width: 100%; height: auto; padding-bottom: 16px; } .card.mvp .nm { margin-top: 18px; }
.card .st b { font: 600 20px/1 Teko; margin-right: 3px; }
.card.blue { background: linear-gradient(160deg, #8fb5ff, #3c6fd8 55%, #2a4fa6); color: #fff; }
.card.big { width: 300px; height: 420px; } .card.big .rt { font-size: 80px; } .card.big .nm { font-size: 44px; margin-top: 110px; } .card.big .st { font-size: 19px; } .card.big .st b { font-size: 32px; }
.stat { display: grid; grid-template-columns: 170px 1fr 48px; align-items: center; gap: 12px; margin: 9px 0; font: 600 18px Rajdhani; letter-spacing: .04em; }
.stat .tr { height: 10px; border-radius: 6px; background: #0b1a3d; overflow: hidden; }
.stat .tr i { display: block; height: 100%; border-radius: 6px; }
.stat .v { font: 600 28px/1 Teko; text-align: right; }
.res { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--edge); font: 600 18px Rajdhani; }
.res:last-child { border-bottom: 0; }
.wl { width: 34px; height: 34px; display: grid; place-items: center; font: 600 22px Teko; border-radius: 8px; clip-path: polygon(20% 0, 100% 0, 80% 100%, 0 100%); }
.W { background: var(--win); color: #062616; } .L { background: var(--loss); color: #2c0606; } .D, .NR { background: #8a97b5; }
.sc { font: 600 30px/1 Teko; letter-spacing: .02em; }
.dim { color: var(--dim); font: 600 15px Rajdhani; }
.podium { display: flex; align-items: flex-end; gap: 10px; justify-content: center; height: 360px; margin-top: 10px; }
.pod { width: 150px; text-align: center; }
.pod .blk { border-radius: 10px 10px 0 0; display: grid; place-items: center; font: 600 64px Teko; color: #1c1405; }
.pod .who { font: 600 24px/1.1 Teko; text-transform: uppercase; margin: 8px 0 4px; } .pod .val { font: 600 34px/1 Teko; color: var(--gold); }
</style></head><body>
<div class="top"><span class="logo">STATS PACK</span><span class="season" id="season"></span>
  <span class="keys" style="margin-left:40px">Switch <kbd>Q</kbd><kbd>E</kbd> · Search <kbd>/</kbd></span>
  <span class="chip" id="chip"></span></div>
<div class="wrap"><nav class="menu" id="menu"></nav><div class="content" id="main"></div></div>
<script>
const NAV = [["home", "My team"], ["player", "Players"], ["match", "Match centre"], ["series", "Series"], ["leaders", "Leaderboard"], ["rankings", "World ranking"]];
document.getElementById("menu").innerHTML = NAV.map(([k, v]) => `<a class="${k === PAGE ? "on" : ""}"><span class="ar">▶</span>${v}</a>`).join("") +
  `<div class="hint">CAREER · INDIA<br>${R.length} MATCHES PLAYED<br>${won} WON · ${lost} LOST</div>`;
document.getElementById("season").textContent = "Season 2026 · India";
document.getElementById("chip").innerHTML = `${img(TEAM, 34)} <span>ODI rating</span> <b>${f0(banner.ODIs.elo)}</b>`;
const M = document.getElementById("main");
const box = (title, body, style = "") => `<div class="box" style="${style}"><h3>${title}</h3>${body}</div>`;
const rating = (p, sec) => (D.ratings[sec].find(r => r.player === p) || {}).batting;
const bwrating = (p, sec) => (D.ratings[sec].find(r => r.player === p) || {}).bowling;
const pcol = v => v >= 80 ? "#4fe0a0" : v >= 60 ? "#c8e05a" : v >= 40 ? "#ffc85a" : "#ff6b6b";
const fcard = (cls, rt, pos, name, stats) => `<div class="card ${cls}"><div class="rt">${rt ?? "–"}</div><div class="pos">${pos}</div>${img(TEAM, cls.includes("big") ? 64 : 44)}
  <div class="nm">${name}</div><div class="st">${stats.map(([k, v]) => `<span><b>${v}</b>${k}</span>`).join("")}</div></div>`;
const AX = {axisLabel: {color: "#9db0dc", fontFamily: "Rajdhani", fontSize: 13, fontWeight: 600}, axisLine: {lineStyle: {color: "#2b4c92"}}, axisTick: {show: false}, splitLine: {lineStyle: {color: "#1d3a78"}}};

const pages = {
home() {
  const tb = D.bat.T20Is, tw = D.bowl.T20Is;
  M.innerHTML = `<h1><small>Squad hub</small>India</h1>
  <div class="g" style="grid-template-columns: 1.1fr 1fr 1fr">
    ${box("Team ratings", `<div id="hex" style="height:220px"></div><div class="dim" style="text-align:center">Rank in the world by format (Elo)</div>`)}
    ${box(`Last match · ${FORMAT[R[0].section]} ${R[0].no} of ${R[0].of}`, `<div class="res" style="grid-template-columns:44px 1fr auto">${img(TEAM, 40)}<span style="font-size:22px">India</span><span class="sc">${R[0].us}</span></div>
      <div class="res" style="grid-template-columns:44px 1fr auto">${img(R[0].opp, 40)}<span style="font-size:22px">${R[0].opp}</span><span class="sc" style="color:var(--dim)">${R[0].them}</span></div>
      <div style="margin-top:10px;font:600 17px Rajdhani;color:var(--win)">✔ ${R[0].result}</div><div class="dim">MVP · ${R[0].pom}</div>`)}
    ${box("Form", `<div style="display:flex;gap:6px;margin-bottom:12px">${R.slice(0, 8).reverse().map(r => `<span class="wl ${r.outcome}">${r.outcome}</span>`).join("")}</div>
      ${SERIES.slice(0, 3).map(s => `<div class="res">${img(s.opp, 30)}<span>${s.opp} · ${s.section}</span><span style="font:600 24px Teko;color:${s.w > s.l ? "var(--win)" : s.w < s.l ? "var(--loss)" : "var(--dim)"}">${s.w}–${s.l}</span></div>`).join("")}`)}
  </div>
  <div class="box" style="margin-top:16px"><h3>Star players · T20Is · rating out of 1000</h3><div style="display:flex;gap:16px;overflow:hidden">
    ${tb.slice(0, 3).map(p => fcard("", rating(p.player, "T20Is"), "BAT", p.player, [["RUN", p.runs], ["AVG", f1(p.average)], ["SR", f0(p.strike_rate)], ["HS", p.high_score_text]])).join("")}
    ${tw.slice(0, 3).map(p => fcard("blue", bwrating(p.player, "T20Is"), "BOWL", p.player, [["WKT", p.wickets], ["AVG", f1(p.average)], ["ECO", f2(p.economy)], ["BB", p.best]])).join("")}
  </div></div>`;
  const f = ["T20Is", "ODIs", "Tests"];
  chart("hex", {series: f.map((x, i) => ({type: "gauge", center: [`${17 + i * 33}%`, "42%"], radius: "36%", startAngle: 90, endAngle: -270, min: 0, max: 1,
    progress: {show: true, width: 9, itemStyle: {color: ["#ee7660", "#dab16f", "#39d0ff"][i]}}, axisLine: {lineStyle: {width: 9, color: [[1, "#0b1a3d"]]}}, pointer: {show: false}, axisTick: {show: false}, splitLine: {show: false}, axisLabel: {show: false},
    title: {offsetCenter: [0, "150%"], color: "#9db0dc", fontFamily: "Rajdhani", fontWeight: 700, fontSize: 16}, detail: {offsetCenter: [0, "4%"], formatter: () => ord(banner[x].rank), color: "#fff", fontFamily: "Teko", fontSize: 32},
    data: [{value: 1 - (banner[x].rank - 1) / banner[x].teams, name: x}]}))});
},
player() {
  const o = SP.ODIs, sr = D.star_runs, rd = D.radar[STAR], keys = Object.keys(rd), inn = D.star_innings.filter(i => i.section === "ODIs");
  M.innerHTML = `<h1><small>Player profile · ODIs</small>${STAR}</h1>
  <div class="g" style="grid-template-columns: 330px 1fr 1fr">
    <div>${fcard("big", rating(STAR, "ODIs"), "BAT · ODI", STAR, [["RUN", o.runs], ["AVG", f1(o.average)], ["SR", f1(o.strike_rate)], ["HS", o.high_score_text], ["50s", o.fifties], ["4s", o.fours]])}</div>
    ${box("Attributes · percentile v " + D.radar_pool + " ODI batters", keys.map(k => `<div class="stat"><span>${k}</span><div class="tr"><i style="width:${rd[k]}%;background:${pcol(rd[k])}"></i></div><span class="v" style="color:${pcol(rd[k])}">${f0(rd[k])}</span></div>`).join(""))}
    ${box("Skill shape", `<div id="hex" style="height:330px"></div>`)}
  </div>
  <div class="g" style="grid-template-columns: 2fr 1fr 1fr">
    ${box("Match log · runs per innings", `<div id="log" style="height:210px"></div>`)}
    ${box("Run sources", `<div id="d1" style="height:210px"></div>`)}
    ${box("Dismissals", `<div id="d2" style="height:210px"></div>`)}
  </div>`;
  chart("hex", {radar: {shape: "polygon", indicator: keys.map(k => ({name: k.toUpperCase().replace("RUNS ABOVE AVERAGE", "RUNS ABOVE\nAVERAGE"), max: 100})), radius: "56%", axisName: {color: "#dfe7ff", fontFamily: "Rajdhani", fontWeight: 700, fontSize: 12},
      splitNumber: 4, splitLine: {lineStyle: {color: "#2b4c92"}}, splitArea: {areaStyle: {color: ["#132c66", "#16316f"]}}, axisLine: {lineStyle: {color: "#2b4c92"}}},
    series: [{type: "radar", data: [{value: keys.map(k => rd[k]), symbolSize: 6, areaStyle: {color: "rgba(57,208,255,.3)"}, lineStyle: {color: "#39d0ff", width: 3}, itemStyle: {color: "#39d0ff"}}]}]});
  chart("log", {grid: {left: 30, right: 10, top: 28, bottom: 24}, xAxis: {type: "category", data: inn.map(i => ab(i.opp) + " " + day(i.date)), ...AX, splitLine: {show: false}}, yAxis: {...AX},
    series: [{type: "bar", barWidth: "50%", data: inn.map(i => ({value: i.runs, itemStyle: {color: i.runs >= 50 ? "#39d0ff" : "#ee7660", borderRadius: [6, 6, 0, 0]}})),
      label: {show: true, position: "top", color: "#fff", fontFamily: "Teko", fontSize: 20}}]});
  const G = {radius: ["36%", "54%"], round: 6, pad: 3, font: "Rajdhani", size: 14, centreFont: "600 32px Teko", subFont: "700 12px Rajdhani"};
  donut("d1", [["Fours", sr.from4, "#39d0ff"], ["Sixes", sr.from6, "#dab16f"], ["Running", sr.running, "#ee7660"]], String(sr.runs), "RUNS", G);
  donut("d2", Object.entries(sr.how).map(([k, v], i) => [cap(k), v, ["#ee7660", "#dab16f", "#39d0ff"][i]]), String(sr.outs), "OUTS", G);
},
match() {
  const mt = D.match, [a, b] = mt.cards, pom = b.bat.find(x => x.player === mt.pom);
  const rows = c => c.bat.filter(x => x.did_bat).map(x => `<div class="stat" style="grid-template-columns: 130px 1fr 44px;margin:6px 0"><span style="${x.player === mt.pom ? "color:var(--gold)" : ""}">${x.player}</span>
    <div class="tr"><i style="width:${x.runs / 1.1}%;background:${x.player === mt.pom ? "#dab16f" : "#39d0ff"}"></i></div><span class="v">${x.runs}${x.out ? "" : "*"}</span></div>`).join("");
  M.innerHTML = `<h1><small>Match centre · ODI ${mt.no} of ${mt.of} · ${dayY(mt.date)}</small>${a.team} v ${b.team}</h1>
  <div class="g" style="grid-template-columns: 1fr 1fr 240px">
    ${[a, b].map(c => box(c.team, `<div style="display:flex;align-items:center;gap:16px">${img(c.team, 64)}<div><div class="sc" style="font-size:64px">${scoreOf(c)}</div><div class="dim">${c.overs} overs</div></div>
      ${c.team === TEAM ? `<span style="margin-left:auto;font:600 26px Teko;color:var(--win)">WINNER</span>` : ""}</div>`)).join("")}
    ${fcard("mvp", pom.runs + (pom.out ? "" : "*"), "PLAYER OF THE MATCH", mt.pom, [["RUN", pom.runs], ["BALL", pom.balls], ["4s", pom.fours], ["6s", pom.sixes]])}
  </div>
  <div class="g" style="grid-template-columns: 1fr 1fr">${box(a.team + " batting", rows(a))}${box(b.team + " batting", rows(b))}</div>
  <div class="g" style="grid-template-columns: 1fr">${box("Momentum · score at each wicket", `<div id="mo" style="height:220px"></div>`)}</div>`;
  const pts = c => [[0, 0], ...c.fow.map(w => [w.wicket, w.score]), ...(c.fow.length < 10 ? [[c.fow.length + 0.6, c.runs]] : [])];
  chart("mo", {grid: {left: 40, right: 90, top: 16, bottom: 30}, xAxis: {type: "value", min: 0, max: 10, interval: 1, ...AX, name: "WICKETS", nameTextStyle: {color: "#9db0dc", fontFamily: "Rajdhani"}}, yAxis: {...AX},
    series: [[a, "#ee7660"], [b, "#39d0ff"]].map(([c, col]) => ({type: "line", data: pts(c), symbolSize: 9, lineStyle: {width: 4, color: col, shadowBlur: 12, shadowColor: col}, itemStyle: {color: col},
      areaStyle: {color: col, opacity: .08}, endLabel: {show: true, formatter: `${ab(c.team)} ${scoreOf(c)}`, color: col, fontFamily: "Teko", fontSize: 22}}))});
},
series() {
  const S = D.series, ss = SERIES.find(s => s.section === "T20Is" && s.opp === "West Indies");
  M.innerHTML = `<h1><small>Series · T20Is · October 2026</small>India v West Indies</h1>
  <div class="box" style="margin-top:18px"><h3>Series path</h3><div id="path" style="height:170px"></div></div>
  <div class="g" style="grid-template-columns: 260px 1fr 1fr">
    <div class="box" style="text-align:center;background:linear-gradient(160deg, #f0d39a, #dab16f 60%, #b98d45);color:#1c1405"><h3 style="color:#1c1405">Series result</h3>
      <div style="font:600 30px Teko">INDIA WIN</div><div style="font:600 110px/0.9 Teko">${ss.w}–${ss.l}</div><div style="font:700 15px Rajdhani;letter-spacing:.12em">5 MATCHES · ${SERIES.indexOf(ss) === 0 ? "LATEST" : ""}</div></div>
    ${box("Top batters", S.bat.slice(0, 5).map((x, i) => `<div class="res" style="grid-template-columns: 30px 34px 1fr auto"><span style="font:600 24px Teko;color:var(--gold)">${i + 1}</span>${img(x.team, 30)}<span>${x.player}</span><span class="sc">${x.runs}</span></div>`).join(""))}
    ${box("Top bowlers", S.bowl.slice(0, 5).map((x, i) => `<div class="res" style="grid-template-columns: 30px 34px 1fr auto"><span style="font:600 24px Teko;color:var(--gold)">${i + 1}</span>${img(x.team, 30)}<span>${x.player}</span><span class="sc">${x.wickets}</span></div>`).join(""))}
  </div>`;
  const xs = S.matches.map((r, i) => i);
  chart("path", {grid: {left: 60, right: 60, top: 30, bottom: 40}, xAxis: {type: "category", data: S.matches.map(r => `T20I ${r.no} · ${day(r.date)}`), ...AX, axisLine: {show: false}, splitLine: {show: false}, axisLabel: {...AX.axisLabel, fontSize: 15}},
    yAxis: {show: false, min: -1, max: 1}, series: [{type: "line", z: 1, data: xs.map(() => 0), symbol: "none", lineStyle: {color: "#2b4c92", width: 6}},
      {type: "scatter", z: 5, data: S.matches.map(r => ({value: 0, itemStyle: {color: r.outcome === "W" ? "#4fe0a0" : "#ff6b6b", borderColor: "#0c1e48", borderWidth: 4}})), symbol: "diamond", symbolSize: 54,
        label: {show: true, formatter: p => S.matches[p.dataIndex].outcome, color: "#0c1e48", fontFamily: "Teko", fontSize: 28}},
      {type: "scatter", data: S.matches.map(() => 0.8), symbolSize: 0, label: {show: true, formatter: p => `${S.matches[p.dataIndex].us} v ${S.matches[p.dataIndex].them}`, color: "#dfe7ff", fontFamily: "Teko", fontSize: 20}}]});
},
leaders() {
  const L = D.leaders.T20Is;
  const pod = (rows, key, unit) => { const o = [rows[1], rows[0], rows[2]], h = [170, 230, 130], c = ["#c9d2e6", "#dab16f", "#c08a55"];
    return `<div class="podium">${o.map((x, i) => `<div class="pod">${img(x.team, 44)}<div class="who">${x.player}</div><div class="val">${x[key]} <span class="dim">${unit}</span></div>
      <div class="blk" style="height:${h[i]}px;background:${c[i]}">${[2, 1, 3][i]}</div></div>`).join("")}</div>` +
      rows.slice(3, 8).map((x, i) => `<div class="res" style="grid-template-columns: 30px 34px 1fr auto"><span style="font:600 22px Teko;color:var(--gold)">${i + 4}</span>${img(x.team, 28)}<span>${x.player}</span><span class="sc">${x[key]}</span></div>`).join(""); };
  M.innerHTML = `<h1><small>Leaderboard · T20Is 2026</small>Who's on top</h1>
  <div class="g" style="grid-template-columns: 1fr 1fr">${box("Most runs", pod(L.bat, "runs", "runs"))}${box("Most wickets", pod(L.bowl, "wickets", "wkts"))}</div>`;
},
rankings() {
  const T = D.rankings.ODIs, prev = ELO.snaps[ELO.snaps.length - 6] || ELO.snaps[0];
  M.innerHTML = `<h1><small>World ranking · ODIs · Elo</small>Climb the ladder</h1>
  <div class="g" style="grid-template-columns: 1fr 1.25fr">
    ${box("Ladder · change over the last 5 match days", T.teams.map(x => { const ch = prev.rank[x.team] - x.rank;
      return `<div class="res" style="grid-template-columns: 34px 34px 1fr 50px 70px;${x.team === TEAM ? "background:rgba(238,118,96,.18);border-radius:8px;padding-left:6px" : ""}"><span style="font:600 24px Teko;color:var(--gold)">${x.rank}</span>${img(x.team, 28)}
        <span>${x.team}</span><span style="font:600 18px Teko;color:${ch > 0 ? "var(--win)" : ch < 0 ? "var(--loss)" : "var(--dim)"}">${ch > 0 ? "▲" + ch : ch < 0 ? "▼" + -ch : "–"}</span><span class="sc" style="text-align:right;font-size:26px">${f0(x.elo)}</span></div>`; }).join(""))}
    ${box("Rank race", `<div id="c1" style="height:560px"></div>`)}
  </div>`;
  chart("c1", {grid: {left: 16, right: 70, top: 14, bottom: 30}, xAxis: {type: "category", data: ELO.snaps.map(s => day(s.date)), ...AX, splitLine: {show: false}},
    yAxis: {inverse: true, min: 1, max: ELO.teams.length, show: false},
    series: ELO.teams.map(t => ({type: "line", data: ELO.snaps.map(s => s.rank[t]), symbol: "none", z: t === TEAM ? 5 : 1,
      lineStyle: {width: t === TEAM ? 6 : 2, color: t === TEAM ? "#ee7660" : "rgba(57,208,255,.35)", shadowBlur: t === TEAM ? 14 : 0, shadowColor: "#ee7660"},
      endLabel: {show: true, formatter: () => ab(t), color: t === TEAM ? "#fff" : "#9db0dc", fontFamily: "Teko", fontSize: t === TEAM ? 24 : 17}}))});
}};
pages[PAGE]();
</script></body></html>
