<!doctype html>
<html><head><meta charset="utf-8"><title>Mix</title>
<link href="fonts.css" rel="stylesheet">
<script src="echarts.min.js"></script><script src="data.js"></script><script src="lib.js"></script>
<!-- Bento as the base, with the parts picked from the other styles:
     Broadcast: the player page, the most-runs-in-the-series table, the leaderboards
     Almanack: the player-of-the-match summary (headline + the engine's match report)
     Scoreboard: Bebas Neue for every player and team name
     Numbers: Bento's Space Grotesk in every idea
     Match page: a TV-style match summary first (top three batters and bowlers in each innings, one each in a Test) with the
       player of the match story, then the scorecard one innings at a time (bowling, then batting)
     Charts: only the kinds already shown on those pages.
     ?idea=1  Bento × Broadcast   ?idea=2  Bento × Scoreboard   ?idea=3  Clean Bento -->
<style>
:root { --page:#0f2557; --tile:#162f68; --tile2:#1b3878; --edge:#24427f; --rail:#dab16f; --ink:#f3f6fc; --dim:#9fb0d6; --soft:#c9d5f2;
  --orange:#ee7660; --gold:#dab16f; --blue:#7aa2ff; --win:#45c08a; --loss:#ee6a6a; --deep:#0a1b40; --led:#ffc65a; --r:18px;
  --nf:'Space Grotesk'; --nw:700; --nls:-.02em; --nc:#fff; --ns:none; }
body.i1 { --r:14px; }
body.i2 { --r:18px; --nc:var(--led); }
body.i3 { --r:24px; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--page); color: var(--ink); font-family: Inter, sans-serif; width: 1440px; display: flex; }

/* the rail: Bento's, in India's light brown */
.rail { width: 92px; min-height: 100vh; background: var(--rail); display: flex; flex-direction: column; align-items: center; padding: 18px 0; gap: 6px; align-self: stretch; flex: none; }
.rail .mark { width: 52px; height: 52px; border-radius: 16px; background: var(--page); color: var(--gold); display: grid; place-items: center; font: 400 26px 'Bebas Neue'; letter-spacing: .04em; margin-bottom: 14px; }
.rail a { width: 74px; padding: 10px 0 8px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #3b2a10; font: 600 11px Inter; text-decoration: none; }
.i1 .rail a, .i2 .rail a { font: 600 14px 'Barlow Condensed'; letter-spacing: .06em; text-transform: uppercase; }
.i2 .rail a { font: 400 15px 'Bebas Neue'; letter-spacing: .1em; }
.rail a svg { width: 24px; height: 24px; }
.rail a.on { background: var(--page); color: #fff; }
.main { flex: 1; min-width: 0; padding: 26px 30px 40px; }

/* the page head */
.head { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
.head h1 { font: 700 34px 'Space Grotesk'; letter-spacing: -.01em; }
.i1 .head h1, .i2 .head h1 { font: 400 48px/1 'Bebas Neue'; letter-spacing: .03em; }
.head .crumb { color: var(--dim); font-size: 14px; margin-top: 4px; }
.i1 .head .crumb { font: 600 16px 'Barlow Condensed'; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.i2 .head .crumb { font: 400 18px 'Bebas Neue'; letter-spacing: .16em; }
.chips { display: flex; gap: 8px; margin-left: auto; }
.chips span { border-radius: 999px; padding: 8px 14px; font: 600 13px Inter; background: var(--tile); border: 1px solid var(--edge); color: var(--dim); }
.chips span.on { background: var(--ink); color: var(--page); border-color: var(--ink); }
.i1 .chips span { border-radius: 4px; font: 700 15px 'Barlow Condensed'; letter-spacing: .1em; text-transform: uppercase; }
.i1 .chips span.on { background: var(--gold); border-color: var(--gold); color: var(--deep); }
.i2 .chips span { font: 400 17px 'Bebas Neue'; letter-spacing: .12em; padding: 7px 14px 6px; }
.i2 .chips span.on { background: var(--led); border-color: var(--led); color: #1b1300; }
.pill { border-radius: 999px; background: var(--tile); border: 1px solid var(--edge); padding: 9px 16px; font-size: 13px; color: var(--dim); display: flex; gap: 10px; align-items: center; }
.pill kbd { font: 600 11px Inter; border: 1px solid var(--edge); border-radius: 6px; padding: 1px 6px; color: var(--ink); }
.i1 .pill { border-radius: 6px; }
.clock { font: 600 17px 'Space Grotesk'; color: var(--win); letter-spacing: .02em; }

/* tiles */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.sub { display: grid; gap: 16px; }
.t { background: var(--tile); border: 1px solid var(--edge); border-radius: var(--r); padding: 20px 22px; position: relative; overflow: hidden; min-width: 0; }
.tt { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; min-height: 16px; }
.tl { font: 600 12px Inter; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.tr { font: 600 12px Inter; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
.i3 .tl::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); flex: none; }
/* idea 1: Broadcast's gold tab, flush in the tile's corner */
.i1 .t { padding: 0 20px 18px; }
.i1 .tt { margin: 0 -20px 14px; }
.i1 .tl { background: var(--gold); color: var(--deep); font: 700 15px 'Barlow Condensed'; letter-spacing: .16em; padding: 6px 26px 6px 20px; clip-path: polygon(0 0, 100% 0, calc(100% - 14px) 100%, 0 100%); }
.i1 .tr { font: 700 14px 'Barlow Condensed'; letter-spacing: .14em; color: var(--gold); padding-right: 20px; }
/* idea 2: Scoreboard's titles and two-tone top line */
.i2 .t::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: linear-gradient(90deg, #368ee2 0 50%, var(--gold) 50% 100%); }
.i2 .tl, .i2 .tr { font: 400 20px 'Bebas Neue'; letter-spacing: .16em; color: var(--dim); }

/* numbers (each idea's number font) and names (Scoreboard's Bebas Neue, in every idea) */
.nm { font-family: var(--nf); font-weight: var(--nw); letter-spacing: var(--nls); color: var(--nc); text-shadow: var(--ns); line-height: .95; font-variant-numeric: tabular-nums; }
.pn { font-family: 'Bebas Neue'; font-weight: 400; letter-spacing: .035em; line-height: 1; }
.s { color: var(--dim); font-size: 13.5px; margin-top: 6px; line-height: 1.5; }
.s b { color: var(--ink); }
.i2 .s b { color: var(--led); }
.up { color: var(--win) !important; } .down { color: var(--loss) !important; }
.row2 { display: flex; align-items: center; gap: 16px; }
.note { font: 400 13px Inter; color: var(--dim); margin-top: 8px; line-height: 1.45; }

/* won / lost marks: Bento squares, Broadcast chips, Scoreboard lamps */
.sq { display: flex; gap: 6px; flex-wrap: wrap; }
.wl { width: 26px; height: 26px; border-radius: 8px; display: inline-grid; place-items: center; font: 700 11px Inter; color: #0b1b3d; flex: none; }
.i1 .wl { border-radius: 3px; width: 30px; height: 28px; font: 800 16px 'Barlow Condensed'; }
.i2 .wl { border-radius: 50%; width: 28px; height: 28px; }
.wl.W { background: var(--win); } .wl.L { background: var(--loss); } .wl.D, .wl.NR { background: #8a97b5; }
.i2 .wl.W { box-shadow: 0 0 12px rgba(69,192,138,.6); } .i2 .wl.L { box-shadow: 0 0 12px rgba(238,106,106,.55); }

/* lists (Bento) */
.list { display: grid; gap: 10px; }
.li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.av { width: 34px; height: 34px; border-radius: 50%; background: var(--tile2); border: 1px solid var(--edge); display: grid; place-items: center; font: 400 15px 'Bebas Neue'; letter-spacing: .04em; color: var(--gold); }
.bar { height: 6px; border-radius: 3px; background: #0d214c; margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--orange); }
.i1 .bar, .i1 .bar i { border-radius: 0; height: 8px; }
.i2 .bar { height: 10px; border-radius: 0; background: repeating-linear-gradient(90deg, #13245a 0 5px, transparent 5px 7px); }
.i2 .bar i { border-radius: 0; background: repeating-linear-gradient(90deg, var(--led) 0 5px, transparent 5px 7px) !important; filter: drop-shadow(0 0 4px rgba(255,198,90,.6)); }
.tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font: 600 12px Inter; background: #0d214c; color: var(--dim); white-space: nowrap; }
.i1 .tag { border-radius: 3px; }

/* tables: Bento's, and Broadcast's TV table for the series and squad */
table.c { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; }
table.c th { text-align: left; font: 600 11.5px Inter; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); padding: 6px 8px; white-space: nowrap; }
table.c td { padding: 8px 8px; border-top: 1px solid var(--edge); vertical-align: middle; }
table.c .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.c tr.me td { background: rgba(238,118,96,.13); }
table.c tr.me td:first-child { border-radius: 10px 0 0 10px; } table.c tr.me td:last-child { border-radius: 0 10px 10px 0; }
.i1 table.c th, .i1 table.tv th { font: 700 14px 'Barlow Condensed'; letter-spacing: .14em; color: var(--gold); border-bottom: 2px solid var(--gold); }
.i2 table.c th, .i2 table.tv th { font: 400 17px 'Bebas Neue'; letter-spacing: .14em; color: var(--dim); }
table.tv { width: 100%; border-collapse: collapse; }
table.tv th { text-align: left; font: 600 11.5px Inter; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); padding: 6px 10px; border-bottom: 2px solid var(--gold); white-space: nowrap; }
table.tv td { padding: 8px 10px; border-bottom: 1px solid var(--edge); vertical-align: middle; }
table.tv td.r, table.tv th.r { text-align: right; }
table.tv tr.me td { background: rgba(238,118,96,.16); }
.i3 table.tv tr.me td:first-child { border-radius: 10px 0 0 10px; } .i3 table.tv tr.me td:last-child { border-radius: 0 10px 10px 0; }
.tn { font: 600 15px Inter; font-variant-numeric: tabular-nums; }
.i2 .tn { color: var(--led); }
.tn.dimn { color: var(--dim); text-shadow: none; }
.i2 .tn.dimn { color: #e9d7ae; }
.i2 .tl, .i2 .tr { letter-spacing: .12em; }
.hero .side b.isname { font: 400 56px/1 'Bebas Neue'; letter-spacing: .02em; }
.i2 .hero .side b.isname { color: #fff; text-shadow: none; font-size: 60px; }
.how { color: var(--dim); font-size: 12.5px; margin-top: 3px; }
.inl { display: inline-block; height: 6px; border-radius: 3px; background: var(--orange); vertical-align: middle; margin-left: 8px; }
.lg { vertical-align: middle; }
.cell { display: flex; align-items: center; gap: 10px; }

/* the hero: Broadcast's slab banner (ideas 1 and 3), a scoreboard panel (idea 2) */
.hero { grid-column: span 12; position: relative; min-height: 220px; background: var(--tile); border: 1px solid var(--edge); border-radius: var(--r); display: flex; align-items: center; gap: 30px; padding: 0 40px; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 30%; background: var(--orange); clip-path: polygon(40% 0, 100% 0, 100% 100%, 0 100%); }
.hero::before { content: ""; position: absolute; right: 27.5%; top: 0; bottom: 0; width: 5%; background: var(--gold); clip-path: polygon(55% 0, 100% 0, 45% 100%, 0 100%); }
.hero .k { font: 600 20px 'Barlow Condensed'; letter-spacing: .14em; color: var(--gold); text-transform: uppercase; }
.hero h2 { font: 400 112px/.86 'Bebas Neue'; letter-spacing: .02em; font-weight: 400; margin-top: 6px; }
.hero .side { position: absolute; right: 50px; z-index: 2; text-align: right; color: #2a0d07; font: 700 18px 'Barlow Condensed'; letter-spacing: .08em; text-transform: uppercase; line-height: 1.25; }
.hero .side b { display: block; font: 700 54px/1.05 'Space Grotesk'; letter-spacing: -.02em; }
.i2 .hero::after { display: none; }
.i2 .hero::before { right: 0; left: 0; top: 0; bottom: auto; width: auto; height: 4px; clip-path: none; background: linear-gradient(90deg, #368ee2 0 50%, var(--gold) 50% 100%); }
.i2 .hero .k { font: 400 22px 'Bebas Neue'; letter-spacing: .18em; color: var(--dim); }
.i2 .hero .side { color: var(--dim); font: 400 20px 'Bebas Neue'; letter-spacing: .16em; }
.i2 .hero .side b { color: var(--led); }

/* the ticker (idea 1): Broadcast's latest results */
.ticker { grid-column: span 12; height: 44px; background: var(--deep); border-radius: 6px; border-bottom: 2px solid var(--gold); display: flex; align-items: center; gap: 26px; padding: 0 18px; overflow: hidden; white-space: nowrap; }
.ticker .lab { font: 700 15px 'Barlow Condensed'; letter-spacing: .14em; color: var(--gold); }
.tk { font: 600 15px 'Barlow Condensed'; letter-spacing: .04em; display: flex; gap: 8px; align-items: center; }
.tk b { font: 700 14px 'Space Grotesk'; } .tk i { font-style: normal; color: var(--dim); }
.tk .wl { width: 22px; height: 20px; font-size: 13px; }

/* the Almanack summary: kicker, headline (in Bebas Neue), the match report */
.kick { font: 700 12px Inter; letter-spacing: .16em; text-transform: uppercase; color: var(--orange); }
.i1 .kick { font: 700 16px 'Barlow Condensed'; color: var(--gold); }
.i2 .kick { font: 400 19px 'Bebas Neue'; letter-spacing: .18em; color: var(--win); }
.hl { font: 400 46px/1 'Bebas Neue'; letter-spacing: .02em; margin: 8px 0 12px; }
.deck { font: 400 15.5px/1.6 Inter; color: var(--soft); }
.i3 .paper { background: #f5efe3; color: #1d1a16; border-color: #e6dcc8; }
.i3 .paper .tl { color: #7a7166; } .i3 .paper .tl::before { background: #cf5a2e; }
.i3 .paper .kick { color: #cf5a2e; } .i3 .paper .hl { color: #1d1a16; }
.i3 .paper .deck { font: 400 17px/1.6 'Source Serif 4'; color: #4a443c; }
.i3 .paper .nm { color: #1d1a16; } .i3 .paper .s { color: #7a7166; } .i3 .paper .s b { color: #1d1a16; }
.i3 .paper .rule { border-color: #d8cfbf; }
.rule { border-top: 1px solid var(--edge); margin: 14px 0 12px; }
.fig { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: baseline; }
.fig .s { margin: 0; }

/* percentile bars: Broadcast's (ideas 1, 3) and Scoreboard's lamp meter (idea 2) */
.pbar { display: grid; grid-template-columns: 170px minmax(0, 1fr) 54px; align-items: center; gap: 12px; margin: 8px 0; }
.pbar .k2 { font: 600 14px Inter; color: var(--soft); }
.i1 .pbar .k2 { font: 600 18px 'Barlow Condensed'; letter-spacing: .05em; text-transform: uppercase; color: var(--ink); }
.i2 .pbar .k2 { font: 400 21px 'Bebas Neue'; letter-spacing: .06em; color: var(--ink); }
.pbar .tr2 { height: 14px; background: #0d214c; position: relative; border-radius: 7px; overflow: hidden; }
.i1 .pbar .tr2 { border-radius: 0; height: 16px; background: var(--deep); }
.pbar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--orange); border-radius: inherit; }
.pbar .v { text-align: right; }
.meter { display: inline-flex; gap: 3px; }
.meter i { width: 18px; height: 18px; border-radius: 2px; background: #13245a; }
.meter i.on { background: var(--led); box-shadow: 0 0 8px rgba(255,198,90,.5); }

/* the last five innings, as tiny bars (Broadcast's innings bars, small) */
.l5 { display: inline-flex; align-items: flex-end; gap: 3px; height: 30px; vertical-align: middle; }
.l5 i { width: 9px; background: var(--orange); border-radius: 2px 2px 0 0; min-height: 2px; }
.l5 i.g { background: var(--gold); }
.i2 .l5 i { background: var(--led); box-shadow: 0 0 6px rgba(255,198,90,.5); } .i2 .l5 i.g { background: var(--win); box-shadow: 0 0 6px rgba(69,192,138,.6); }
.l5t { font: 500 12px Inter; color: var(--dim); margin-left: 8px; letter-spacing: .02em; }

/* match by match rows (series, results): one line each, no scorecards */
.mrow { display: grid; grid-template-columns: 84px 34px 270px minmax(0, 1fr) 210px; gap: 14px; align-items: center; padding: 10px 0; border-top: 1px solid var(--edge); }
.mrow:first-of-type { border-top: 0; }
.mrow .when { font: 600 13px Inter; color: var(--dim); line-height: 1.35; }
.mrow .res { font: 600 13px Inter; text-align: right; }
.sc2 { display: flex; align-items: center; gap: 8px; }
/* the match summary (after the TV graphic): a band for each innings, its top batters and bowlers, the result */
.msum .ttl { text-align: center; font: 400 58px/1 'Bebas Neue'; letter-spacing: .05em; }
.msum .sub2 { text-align: center; font: 600 13px Inter; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); margin-top: 4px; }
.msgrid { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 28px; margin-top: 18px; align-items: start; }
.inn + .inn { margin-top: 14px; }
.inn .band { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto auto; align-items: center; gap: 16px; background: var(--tile2); border-left: 6px solid var(--gold); padding: 8px 20px 8px 16px; }
.inn .band .tm { font: 400 36px/1 'Bebas Neue'; letter-spacing: .04em; }
.inn .band .which { font: 600 12px Inter; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.inn .band .tot { font: 700 34px/1 'Space Grotesk'; letter-spacing: -.02em; }
.inn .band .tot small { font: 500 13px Inter; color: var(--dim); margin-left: 8px; letter-spacing: 0; }
.inn .ppl { display: grid; grid-template-columns: 1fr 1fr; background: #102a5e; border-left: 6px solid #2a4785; }
.inn .p { display: grid; grid-template-columns: minmax(0, 1fr) auto 44px; gap: 10px; align-items: baseline; padding: 7px 20px; min-height: 36px; }
.inn .p:nth-child(even) { border-left: 1px solid var(--edge); }
.inn .p .nmx { font: 400 23px 'Bebas Neue'; letter-spacing: .04em; }
.inn .p .v { font: 700 20px 'Space Grotesk'; text-align: right; } .inn .p .b { font: 500 13px Inter; color: var(--dim); text-align: right; }
.resline { text-align: center; font: 400 38px 'Bebas Neue'; letter-spacing: .05em; margin-top: 18px; color: var(--gold); }
.pomx { background: var(--tile2); border: 1px solid var(--edge); border-radius: calc(var(--r) - 6px); padding: 18px 20px; }
.i1 .inn .band { clip-path: polygon(0 0, 100% 0, calc(100% - 16px) 100%, 0 100%); }
.i1 .inn .ppl { clip-path: polygon(0 0, calc(100% - 16px) 0, calc(100% - 26px) 100%, 0 100%); margin-left: 10px; padding-right: 26px; }
.i2 .inn .band { border-left-color: #368ee2; } .i2 .inn .band .tot { color: var(--led); } .i2 .inn .p .v { color: var(--led); }
.i3 .inn .band { border-radius: 14px 14px 0 0; border-left: 0; padding-left: 20px; } .i3 .inn .ppl { border-radius: 0 0 14px 14px; border-left: 0; }
/* the innings switch */
.itabs { grid-column: span 12; display: flex; align-items: center; gap: 10px; margin-top: 6px; }
.tl2 { font: 400 30px 'Bebas Neue'; letter-spacing: .05em; margin-right: 10px; }
.itabs button { cursor: pointer; border-radius: 999px; padding: 10px 18px; font: 600 14px Inter; background: var(--tile); border: 1px solid var(--edge); color: var(--dim); }
.itabs button.on { background: var(--ink); color: var(--page); border-color: var(--ink); }
.i1 .itabs button { border-radius: 4px; } .i1 .itabs button.on { background: var(--gold); border-color: var(--gold); color: var(--deep); }
.i2 .itabs button.on { background: var(--led); border-color: var(--led); color: #1b1300; }
</style></head><body>
<nav class="rail" id="rail"></nav>
<div class="main"><div class="head" id="head"></div><div class="grid" id="main"></div></div>
<script>
const IDEA = Q.get("idea") || "1";
document.body.classList.add("i" + IDEA);
const SC = 1, NUMF = "Space Grotesk", NUMW = 700;                      // numbers: Bento's font in every idea
const AXF = "Inter", AXS = 11;
const LED = "#ffc65a", OR = "#ee7660", GOLD = "#dab16f", BLUE = "#7aa2ff", WIN = "#45c08a", LOSS = "#ee6a6a", OTHER = "#3a5aa0";
const MINE = IDEA === "2" ? LED : OR;                                   // my team's colour in the charts
const ICON = {home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>', squad: '<circle cx="9" cy="8" r="3.5"/><circle cx="17" cy="9" r="2.5"/><path d="M2 20c1-3.5 3.8-5.5 7-5.5s6 2 7 5.5M15 14.6c2.6-.3 5 1.2 6 4.4"/>',
  player: '<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>', results: '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M12 5v14M3 12h18"/>',
  series: '<path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>', leaders: '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 6h3a3 3 0 0 1-3 4M7 6H4a3 3 0 0 0 3 4"/>',
  rankings: '<path d="M3 17l6-6 4 4 8-8M21 7v5M21 7h-5"/>'};
const NAV = [["home", "My team"], ["squad", "Squad"], ["player", "Players"], ["results", "Matches"], ["series", "Series"], ["leaders", "Leaders"], ["rankings", "Rankings"]];
const ON = {match: "results"}[PAGE] || PAGE;
document.getElementById("rail").innerHTML = `<div class="mark">SP</div>` + NAV.map(([k, v]) =>
  `<a class="${k === ON ? "on" : ""}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>${v}</a>`).join("");
const H = document.getElementById("head"), M = document.getElementById("main");

// ------------------------------------------------------------------ building blocks
const n = (v, px, style = "") => `<span class="nm" style="font-size:${Math.round(px * SC)}px;${style}">${v}</span>`;
const pn = (p, px, style = "") => `<span class="pn" style="font-size:${px}px;${style}">${esc(p)}</span>`;
const wl = o => `<span class="wl ${o}">${o}</span>`;
