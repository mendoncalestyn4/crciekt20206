# Night match (dark) and day match (light). The site follows your computer's
# setting; switch in the ⋮ menu → Settings → Theme.

[theme.dark]
primaryColor = "#f2b632"
backgroundColor = "#0a1322"
secondaryBackgroundColor = "#13203a"
textColor = "#eef2f8"
linkColor = "#7fb6f2"
borderColor = "#22314d"
baseRadius = "12px"
font = "'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif"
headingFont = "'Barlow Condensed', 'Arial Narrow', sans-serif"
headingFontWeights = [700, 700, 700]

[theme.dark.sidebar]
backgroundColor = "#071020"
secondaryBackgroundColor = "#101b31"

[theme.light]
primaryColor = "#1d6b45"
backgroundColor = "#f3f5ef"
secondaryBackgroundColor = "#e6eadf"
textColor = "#0f1b2d"
linkColor = "#1d6b45"
borderColor = "#d5dacb"
baseRadius = "12px"
font = "'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif"
headingFont = "'Barlow Condensed', 'Arial Narrow', sans-serif"
headingFontWeights = [700, 700, 700]

[theme.light.sidebar]
backgroundColor = "#0f1b2d"
secondaryBackgroundColor = "#18273f"
textColor = "#e9eef6"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 1000
