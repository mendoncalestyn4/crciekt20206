# The night-match look: dark, whatever your computer is set to.

[theme]
base = "dark"
primaryColor = "#f2b632"
backgroundColor = "#0a1322"
secondaryBackgroundColor = "#13203a"
textColor = "#eef2f8"
linkColor = "#7fb6f2"
borderColor = "#22314d"
baseRadius = "12px"
font = "'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif"
headingFont = "'Barlow Condensed', 'Arial Narrow', sans-serif"
headingFontWeights = [700, 700, 700]

[theme.sidebar]
backgroundColor = "#071020"
secondaryBackgroundColor = "#101b31"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 1000
