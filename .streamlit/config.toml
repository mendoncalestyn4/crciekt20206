[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#efeee9"
textColor = "#0b0b0b"
linkColor = "#2a78d6"
baseRadius = "10px"
headingFont = "'Barlow Condensed', 'Arial Narrow', sans-serif"
headingFontWeights = [700, 700, 700]

[theme.light.sidebar]
backgroundColor = "#f0efeb"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#1a1a19"
textColor = "#ffffff"
linkColor = "#6da7ec"
baseRadius = "10px"
headingFont = "'Barlow Condensed', 'Arial Narrow', sans-serif"
headingFontWeights = [700, 700, 700]

[theme.dark.sidebar]
backgroundColor = "#141413"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 1000
