# The Stats Pack as one Windows program (stage 5): built on GitHub's Windows machine with your Python (3.14.7), then
# started once to prove it runs (it answers, and its pages are inside), then kept as a download for the updates
# repository. Runs when the program's code, the site or the engine changes, or by hand.
name: Build the program

on:
  push:
    paths: ["desktop/**", "server/**", "ccstats/**", "web/dist/**", "tools/build_program.py", "tools/program_entry.py",
            "design/WHATS_NEW.json", "requirements.txt", ".github/workflows/program.yml"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish this build as the new version (offered to the program as an update)"
        type: boolean
        default: false
      update_test:
        description: "After publishing: install the version before it, and update it to this one for real"
        type: boolean
        default: false

concurrency:
  group: program-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write          # (only to publish a release, when asked)

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"
      - name: Install what the program needs, and the tool that builds it
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build
        run: python tools/build_program.py ${{ github.run_number }}
      - name: Start it once (it must answer and have its pages)
        shell: pwsh
        run: |
          $env:STATS_PACK_HOME = "$env:RUNNER_TEMP\stats-pack-check"
          $p = Start-Process -FilePath "dist\Cricket Captain Stats Pack\Cricket Captain Stats Pack.exe" -ArgumentList "--check" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The program didn't start properly (exit code $($p.ExitCode))" }
          Write-Host "The program started and answered."
      - uses: actions/upload-artifact@v4
        with:
          name: program
          path: |
            dist/*.zip
            dist/latest.json
          retention-days: 30
      - name: Publish it as the new version (only when asked)
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $info = Get-Content dist\latest.json | ConvertFrom-Json
          $notes = ($info.notes | ForEach-Object { "- $_" }) -join "`n"
          gh release create "v$($info.version)" (Get-ChildItem dist\*.zip).FullName dist\latest.json --target $env:GITHUB_SHA --title "Cricket Captain Stats Pack $($info.version)" --notes "$notes"
          Write-Host "Published version $($info.version)."
      - name: Update the version before to this one, for real (only when asked)
        if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.update_test
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install -r requirements.txt
          $info = Get-Content dist\latest.json | ConvertFrom-Json
          $tags = gh release list --limit 10 --json tagName,createdAt | ConvertFrom-Json | Sort-Object createdAt -Descending
          $before = ($tags | Where-Object { $_.tagName -ne "v$($info.version)" } | Select-Object -First 1).tagName
          if (-not $before) { throw "No earlier published version to update from" }
          New-Item -ItemType Directory -Force old | Out-Null
          gh release download $before --pattern "*.zip" --dir old
          python tools/update_check.py (Get-ChildItem old\*.zip).FullName $info.version
