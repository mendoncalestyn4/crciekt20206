# Every change tested automatically on Windows, with the owner's Python (3.14.7) and pandas (3.1), as the fix round
# asks (design/FIX_ROUND_CHECKLIST.md, "Every change tested automatically on Windows"). It runs by itself on every push;
# nothing to do on the PC. The browser tests use Playwright's own Chromium.
name: Tests on Windows

on:
  push:
    # a change to the plan or notes only (no code) doesn't start a run, so it never cancels one still going
    paths-ignore:
      - "**.md"
      - "design/**"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"      # every Monday morning, even with no change: a new library version breaking something shows

# a new push replaces a run still going on the same branch: only the latest code is tested
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # every test, split over three Windows machines at once (each runs every third test), so a run takes about a
    # third of the time; together they are exactly every test, each once
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"
      - name: Install what the site needs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest playwright
          python -m playwright install chromium
      - name: Show the versions
        run: python -c "import sys, pandas; print(sys.version); print('pandas', pandas.__version__)"
      - name: Every test (this machine's third)
        env:
          TEST_SHARD: ${{ matrix.shard }}/3
          WEEKLY: ${{ github.event_name != 'push' && '1' || '0' }}       # the weekly run, and a run started by hand
        run: python -m pytest -q -p no:cacheprovider
