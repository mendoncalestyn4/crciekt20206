# Every change tested automatically on Windows, with the owner's Python (3.14.7) and pandas (3.1), as the fix round
# asks (design/FIX_ROUND_CHECKLIST.md, "Every change tested automatically on Windows"). It runs by itself on every push;
# nothing to do on the PC. The browser tests use Playwright's own Chromium.
name: Tests on Windows

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - name: Install what the site needs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest playwright
          python -m playwright install chromium
      - name: Show the versions
        run: python -c "import sys, pandas; print(sys.version); print('pandas', pandas.__version__)"
      - name: Every test
        run: python -m pytest -q -p no:cacheprovider
